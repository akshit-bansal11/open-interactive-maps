name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The non-mutating twin of `npm run check`: `biome ci` reports a badly
      # formatted file where `biome check --write` would quietly rewrite it.
      - run: npm run check:ci

      - run: npm test

      - run: npm audit --audit-level=high
